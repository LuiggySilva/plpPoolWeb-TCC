[project]
name = "plppoolweb"
version = "0.1.0"
description = "Aplicação web com objetivo de dar suporte ao professor e monitores da disciplina Paradigma de Linguagens de Programação do curso de Ciência da Computação da UFCG"
authors = [{ name = "Luiggy Silva", email = "luiggy.silva@ccc.ufcg.edu.br" }]

# readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "celery (==5.5.2)",
    "crispy-bootstrap5 (==2025.4)",
    "django (==5.2.1)",
    "django-allauth (==65.8.0)",
    "django-appconf (==1.1.0)",
    "django-cleanup (==9.0.0)",
    "django-crispy-forms (==2.4)",
    "django-filter (==25.1)",
    "django-mathfilters (==1.0.0)",
    "django-model-utils (==5.0.0)",
    "django-solo (==2.4.0)",
    "docker (==7.1.0)",
    "gunicorn (==23.0.0)",
    "pillow (==11.2.1)",
    "psycopg2-binary (==2.9.10)",
    "python-decouple (==3.8)",
    "pygments (==2.19.1)",
    "requests (==2.32.3)",
    "redis (==6.2.0)",
    "whitenoise (==6.9.0)",
    "django-widget-tweaks (>=1.5.0,<2.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "django-celery-results (>=2.6.0,<3.0.0)",
    "django-redis (>=5.4.0,<6.0.0)",
    "django-adminfilters (>=2.6,<3.0)",
    "pyopenssl (>=26.2.0,<27.0.0)",
    "django-htmx (>=1.27.0,<2.0.0)",
    "django-simple-history (>=3.11.0,<4.0.0)",
]
[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "django-debug-toolbar (==5.2.0)",
    "django-extensions (==4.1)",
    "pydot (>=4.0.1,<5.0.0)",
    "rich (==14.0.0)",
    "werkzeug (>=3.1.8,<4.0.0)",
]


[build-system]

requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "migrations",
    "staticfiles",
    "mediafiles",
    "core/settings",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # isort
    "I",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # simplify
    "SIM",
    # naming
    "N",
    # comprehensions
    "C4",
    # return improvements
    "RET",
    # unused arguments
    "ARG",
    # debugger
    "T20",
]

ignore = [
    # line length handled by formatter
    "E501",
    # Django frequentemente usa atributos dinâmicos
    "N815",
    # conflitos com formatter
    "W191",
]

fixable = ["ALL"]

unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["core", "questions", "user", "code_compiler"]

section-order = [
    "future",
    "standard-library",
    "third-party",
    "django",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["E402"]
"*/settings.py" = ["F403", "F405"]
"*/migrations/*.py" = ["E501", "F401", "F811"]

[tool.coverage.run]
omit = [
    "*/__pycache__/*",
    "*/migrations/*",
    "*/tests/*",
    "core/*",
    "venv/*",
    "htmlcov/",
    "static/",
    "media/",
    "manage.py",
    "*/__init__.py",
    "*/admin.py",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"

python_files = ["tests.py", "test_*.py", "*_tests.py"]

testpaths = ["app"]

pythonpath = ["app"]
