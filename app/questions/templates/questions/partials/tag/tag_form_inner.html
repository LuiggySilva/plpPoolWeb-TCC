{% load crispy_forms_tags %}

<div class="modal-content border-0 shadow">
    <div class="modal-header border-bottom bg-body-tertiary">
        <h1 class="modal-title fs-5 font-monospace fw-bold">
            <i class="bi bi-tag {% if action == 'edit' %}text-primary{% else %}text-success{% endif %}"></i> 
            {% if action == 'edit' %}Editar{% else %}Salvar{% endif %} Tag
        </h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body p-4">
        <form hx-post="{% if action == 'create' %}{% url 'questions:tag_create' %}{% else %}{% url 'questions:tag_edit' tag.id %}{% endif %}" hx-target="#modalTagForm .modal-dialog" method="post">
            {% csrf_token %}
            <input type="hidden" name="tag_id" value="{{ tag.id|default:'' }}">
            <input type="hidden" name="action" value="{{ action }}">
            
            <div class="mb-3">
                {{ tag_form|crispy }}
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <button type="button" class="btn btn-secondary" data-bs-target="#modalTagList" data-bs-toggle="modal">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
                <button type="submit" class="btn btn-success fw-bold px-4">
                    <i class="bi bi-floppy"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>
