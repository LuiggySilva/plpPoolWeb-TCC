{% load crispy_forms_tags %}

<div class="modal-content border-0 shadow">
    <div class="modal-header border-bottom bg-body-tertiary">
        <h1 class="modal-title fs-5 font-monospace fw-bold">
            <i class="bi bi-people {% if action == 'edit' %}text-primary{% else %}text-success{% endif %}"></i> 
            {% if action == 'edit' %}Editar{% else %}Salvar{% endif %} Professor
        </h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    
    <div class="modal-body p-4">
        <form hx-post="{% if action == 'create' %}{% url 'user:professor_create' %}{% else %}{% url 'user:professor_edit' professor.id %}{% endif %}" hx-target="#modalProfessorForm .modal-dialog">
            {% csrf_token %}
            
            <div class="alert alert-info d-flex align-items-center shadow-sm border-0 mb-4" role="alert">
                <i class="bi bi-info-circle-fill fs-3 me-3 text-info"></i>
                <div>
                    A senha padrão é a matrícula. Recomenda-se a alteração após o primeiro acesso.
                </div>
            </div>

            <div class="mb-3">
                {{ professor_form|crispy }}
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <button type="button" class="btn btn-secondary" data-bs-target="#modalProfessorList" data-bs-toggle="modal">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>

                <div class="d-flex gap-2">
                    {% if action == 'edit' %}
                        <button type="button" 
                                class="btn btn-outline-warning"
                                hx-post="{% url 'user:professor_reset_password' professor.id %}"
                                hx-confirm="Deseja resetar a senha deste professor para a matrícula?"
                                hx-target="#professor-table-body">
                            <i class="bi bi-arrow-counterclockwise"></i> Resetar senha
                        </button>
                    {% endif %}

                    <button type="submit" class="btn btn-success fw-bold px-4">
                        <i class="bi bi-floppy"></i> Salvar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
