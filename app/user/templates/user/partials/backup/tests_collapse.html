<div class="mt-2">
    <button class="btn btn-sm btn-light border w-100 text-start d-flex justify-content-between align-items-center" 
            type="button" data-bs-toggle="collapse" data-bs-target="#tests-{{ type }}-{{ index }}">
        <span class="small fw-bold"><i class="bi bi-terminal"></i> Casos de Teste ({{ tests|length }})</span>
        <i class="bi bi-chevron-down small"></i>
    </button>
    
    <div class="collapse mt-2" id="tests-{{ type }}-{{ index }}">
        <div class="list-group">
            {% for test in tests %}
                <div class="list-group-item bg-dark border-secondary p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong class="small text-light">#{{ forloop.counter }}</strong>
                        <span class="badge bg-secondary" style="font-size: 0.6rem;">{{ test.type }}</span>
                    </div>
                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <strong class="small text-info">Entrada:</strong>
                            <pre class="code-container preserve-format mt-1 p-2 bg-black" style="max-height: 150px; font-size: 0.75rem;">{{ test.input_data }}</pre>
                        </div>

                        <div class="col-12 col-md-6">
                            <strong class="small text-danger">Saída:</strong>
                            <pre class="code-container preserve-format mt-1 p-2 bg-black" style="max-height: 150px; font-size: 0.75rem;">{{ test.output_data }}</pre>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
