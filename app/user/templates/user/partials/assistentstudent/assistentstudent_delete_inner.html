<div class="modal-content border-0 shadow text-center">
    <div class="modal-body p-4">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
        <h4 class="mt-3 fw-bold">Remover Monitor?</h4>
        <p class="text-muted">Tem certeza que deseja remover: </p>

        <ul class="list-group list-group-flush mb-4">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="bi bi-person-fill text-primary me-2"></i><strong>Nome:</strong> {{ assistentstudent.name }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="bi bi-card-text text-primary me-2"></i> <strong>Matrícula:</strong> {{ assistentstudent.registration }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="bi bi-envelope-fill text-primary me-2"></i> <strong>Email:</strong> {{ assistentstudent.email }}</span>
            </li>
        </ul>
        
        <div class="d-flex justify-content-center gap-2 mt-4">
            <button type="button" class="btn btn-secondary" data-bs-target="#modalMonitorList" data-bs-toggle="modal">Cancelar</button>

            <form hx-post="{% url 'user:assistentstudent_delete' assistentstudent.id %}" hx-target="#modalMonitorList table tbody">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger fw-bold px-4">Remover</button>
            </form>
        </div>
    </div>
</div>
