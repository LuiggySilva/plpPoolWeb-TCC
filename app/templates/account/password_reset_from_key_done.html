{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password changed" %} - plpPoolWeb{% endblock title %}

{% block content %}
    <div class="container d-flex flex-column align-items-center justify-content-center mt-5 mb-4">
        <div class="text-center mb-4">
            <i class="bi bi-shield-check fs-1 text-success"></i>
            <h2 class="fw-bold font-monospace mt-2">Senha Alterada</h2>
        </div>

        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card p-4 p-sm-5 border rounded-4 bg-body-tertiary shadow-sm text-center">
                    <p class="fs-5 text-body-emphasis mb-4">Sua senha foi atualizada com sucesso!</p>
                    
                    <div class="d-grid justify-content-center">
                        <a href="{% url 'account_login' %}" class="btn btn-primary px-5 shadow-sm">
                            <i class="bi bi-box-arrow-in-right"></i> Fazer Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
