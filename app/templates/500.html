{% extends "base.html" %}

{% block content %}
    <div class="container mb-4">
        <h1 class="text-center"><i class="bi bi-bug text-danger"></i>&nbsp;Erro interno do servidor</h1>

        <hr>

        <div class="d-flex flex-column justify-content-center align-items-center">
            <p class="text-muted">Ocorreu um erro inesperado no servidor. Já estamos trabalhando para corrigir isso.</p>
            {% if request.user.is_authenticated %}
                <a href="{% url 'user:about' %}" class="btn btn-outline-primary mt-3">Voltar para a página inicial</a>
            {% else %}
                <a href="{% url 'account_login' %}" class="btn btn-outline-primary mt-3">Voltar para o login</a>
            {% endif %}
        </div>
    </div>
{% endblock %}
